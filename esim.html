    <p>An eSIM (electronic SIM) is a digital SIM card built directly into your phone — no physical card required. Instead of hunting for a SIM kiosk at the airport or paying for expensive international roaming, you scan a QR code before your flight, and the plan activates the moment you land.</p>

    <h2>How much does an eSIM cost for travel abroad?</h2>
    <p>Pricing depends on the destination, the amount of data (GB), and the number of days. A basic eSIM plan for a European destination typically runs around $4–8, while farther destinations (Asia, Oceania, South America) can range from $10–25 for a few gigabytes over one to two weeks. This is almost always significantly cheaper than roaming with an Israeli carrier.</p>

    <h2>Does an eSIM work in Israel and abroad?</h2>
    <p>Yes — eSIM is now available in most countries worldwide, including Israel itself. The real advantage kicks in when flying abroad: you buy a plan for your specific destination (or a global plan that works in 200+ countries) and you're connected from the moment you land, with no need to hunt for Wi-Fi or risk a surprise roaming bill.</p>

    <ul>

      <li>Turn on mobile data roaming for the new eSIM the moment you land at your destination.</li>
