    <h2>מה זה בכלל כרטיס טיסה פיקטיבי?</h2>
    <p>כרטיס טיסה פיקטיבי (באנגלית: <strong>Onward Ticket</strong> או <strong>Dummy Ticket</strong>) הוא הזמנת טיסה זמנית עם מספר אישור (PNR) אמיתי וניתן לאימות, שנראית בדיוק כמו כרטיס טיסה רגיל — אבל לא שולמה במלואה ולא מיועדת לטיסה בפועל. המטרה שלה היא אחת בלבד: להוכיח שיש לכם תוכנית יציאה מהמדינה שאליה אתם נכנסים.</p>

    <h2>What exactly is a dummy flight ticket?</h2>
    <p>A dummy flight ticket (also called an <strong>Onward Ticket</strong>) is a temporary flight booking with a real, verifiable confirmation number (PNR) that looks exactly like a regular airline ticket — but hasn't been fully paid for and isn't meant for actual travel. It serves exactly one purpose: proving you have a plan to leave the country you're entering.</p>

    <h2>Why do you even need an exit ticket?</h2>
    <p>Many countries and immigration authorities require travelers to prove they intend to leave within their permitted stay (for example, on a tourist visa). This also applies before boarding — some airlines refuse to fly a passenger to a destination that requires an exit ticket without seeing proof in advance, so they don't risk having to fly the passenger back at their own expense.</p>

    <div class="dt-note">
      💡 Important: a dummy flight ticket is a legitimate, widely used tool among backpackers, especially when you don't yet know exactly when or where you're heading next — and it doesn't make sense to pay for a real ticket just to show it at border control.

      <li><strong>At border control</strong> at your destination — an immigration officer may ask you to prove you intend to leave on time.</li>
      <li><strong>When applying for a visa</strong> — many countries require "proof of onward travel" as part of the application process, even before the trip has started.</li>
    </ul>
    <p>Common destinations where this comes up in practice: Thailand, Indonesia, the Philippines, Brazil, the USA, and all Schengen countries, where an exit ticket is required as a condition of entry.</p>

    <h2>How is it different from a regular flight ticket?</h2>
    <p>A dummy flight ticket includes all the details you'd see on a real one — flight number, date, time, and a confirmation number (PNR) that can be checked directly on the airline's website. The difference is that the booking is usually valid for a short period (for example, 24–48 hours) and hasn't been paid for in full, so it's meant purely for display and not for actual travel.</p>
